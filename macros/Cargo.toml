[package]
name = "g3-auth-macros"
version = "0.1.0"

edition = "2024"
description = "Proc macros for g3-auth: `#[public]` and `#[derive(PublicRoutes)]`."
repository = "https://github.com/g3techhq/g3-auth"
readme = "README.md"
documentation = "https://docs.rs/g3-auth-macros"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "auth", "macro"]
categories = ["development-tools::procedural-macro-helpers", "authentication"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**"]

[lib]
name = "g3_auth_macros"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
